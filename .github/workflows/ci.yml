name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain and its rustfmt/clippy; rustup
      # installs it on first use.
      - name: Install Rust
        run: rustup toolchain install

      - run: make rust-check

  # Installs the brenn-scrub release and the gitleaks release it pins, then
  # runs `brenn-scrub init --check` and `brenn-scrub tree`. Reports as
  # `scrub / tree-scan`.
  scrub:
    name: scrub
    uses: rnortman/brenn-scrub/.github/workflows/tree-scan.yml@v0.1.0
